<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="black"/>
  <!-- 3D Isometric House - White version on black background -->
  <g fill="none" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front wall -->
    <path d="M100 380 L100 220 L250 220 L250 380 Z" fill="white"/>
    <!-- Side wall -->
    <path d="M250 220 L250 380 L350 320 L350 160 Z" fill="white"/>
    <!-- Roof front -->
    <path d="M70 220 L175 100 L280 220 Z" fill="white"/>
    <!-- Roof side -->
    <path d="M280 220 L175 100 L380 160 L350 160 Z" fill="white"/>
    <!-- Chimney -->
    <rect x="100" y="80" width="40" height="70" fill="white"/>
  </g>
  <!-- Windows and door cutouts -->
  <rect x="120" y="250" width="45" height="45" fill="black" stroke="white" stroke-width="8"/>
  <rect x="185" y="250" width="45" height="45" fill="black" stroke="white" stroke-width="8"/>
  <rect x="270" y="200" width="40" height="80" fill="black" stroke="white" stroke-width="8"/>
</svg>
