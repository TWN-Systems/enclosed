name: CI - Code Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        pkg:
          - "@enclosed/crypto"
          - "@enclosed/lib"
          - "@enclosed/app-server"
          - "@enclosed/app-client"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm -F ${{ matrix.pkg }} exec vitest run --coverage --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Locate coverage dir
        id: cov
        run: |
          pkg_dir=$(pnpm -F ${{ matrix.pkg }} exec node -e "console.log(process.cwd())")
          echo "dir=$pkg_dir/coverage" >> "$GITHUB_OUTPUT"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.pkg }}
          path: ${{ steps.cov.outputs.dir }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.cov.outputs.dir }}/lcov.info
          flags: ${{ matrix.pkg }}
          name: ${{ matrix.pkg }}
          fail_ci_if_error: false
          verbose: true
