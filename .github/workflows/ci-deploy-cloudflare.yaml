name: CI - Deploy Cloudflare

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-deploy-cloudflare.yaml'
      - '.github/actions/pnpm-setup/**'
  push:
    branches:
      - main
      - twn-main

permissions:
  contents: read

concurrency:
  group: ci-deploy-cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-deploy-cloudflare:
    name: CI - Deploy Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/deploy-cloudflare

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Setup Node + pnpm
        uses: ./.github/actions/pnpm-setup

      - name: Build the app
        run: pnpm build

      - name: Verify build
        run: |
          if [ ! -f dist/_worker.js ]; then
            echo "dist/_worker.js not found"
            exit 1
          fi
          if [ ! -f dist/index.html ]; then
            echo "dist/index.html not found"
            exit 1
          fi
